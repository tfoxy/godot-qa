name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false
jobs:
  version:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false
      - name: Install pinned Rust
        run: rustup toolchain install 1.95.0 --profile minimal
      - name: Verify tag, Cargo, addon and changelog agree
        if: startsWith(github.ref, 'refs/tags/')
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          cargo xtask verify-version "$RELEASE_TAG"
          grep -F "## [${RELEASE_TAG#v}]" CHANGELOG.md
  quality:
    needs: version
    uses: ./.github/workflows/quality.yml
  publish:
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/')
    needs: [version, quality]
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Verify and publish both native bundles
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ github.ref_name }}
        working-directory: dist
        run: |
          set -euo pipefail
          test "$(find . -maxdepth 1 -name '*.tar.gz' | wc -l)" -eq 1
          test "$(find . -maxdepth 1 -name '*.zip' | wc -l)" -eq 1
          cat *.sha256 > SHA256SUMS
          sha256sum --check SHA256SUMS
          archive=$(find . -maxdepth 1 -name '*.tar.gz' -printf '%f')
          tar -xOf "$archive" "${archive%.tar.gz}/CHANGELOG.md" > CHANGELOG.md
          awk -v heading="## [${RELEASE_TAG#v}]" '$0 == heading { found=1; print; next } found && /^## \[/{ exit } found { print }' CHANGELOG.md > RELEASE_NOTES.md
          test -s RELEASE_NOTES.md
          gh release create "$RELEASE_TAG" --verify-tag --title "godot-qa $RELEASE_TAG" --notes-file RELEASE_NOTES.md *.tar.gz *.zip SHA256SUMS

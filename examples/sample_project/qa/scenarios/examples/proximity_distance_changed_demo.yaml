name: proximity_distance_changed_demo
scene: res://ui/main_menu.tscn

viewport:
  width: 1280
  height: 720

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_logs: true

steps:
  - wait_frames: 5
  - call_method:
      target: qa:main_menu
      method: qa_proximity_enable_distance_changed_motion
  - wait_frames: 2

assert:
  - distance_changed:
      a: qa:actor
      b: qa:target
      window_frames: 12
      min: 12
  - no_errors: true

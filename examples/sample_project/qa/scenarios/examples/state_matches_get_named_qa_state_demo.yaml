name: state_matches_get_named_qa_state_demo
scene: res://ui/main_menu.tscn

viewport:
  width: 1280
  height: 720

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_logs: true

steps:
  - wait_frames: 5
  - call_method:
      target: qa:main_menu
      method: qa_temporal_set_mode
      args:
        - steady
  - call_method:
      target: qa:main_menu
      method: qa_surface_place_matching
  - wait_frames: 2

assert:
  - state_matches:
      target: qa:demo_actor
      source: method
      method: get_raft_motion_qa_state
      path: motion.state
      operator: equals
      expected: steady
  - no_errors: true

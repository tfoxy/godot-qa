name: visual_unsupported_target_failure_demo
scene: res://ui/fixtures/visual_evidence_failure_demo.tscn

viewport:
  width: 1280
  height: 720

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_logs: true
  save_screenshot: true

steps:
  - wait_frames: 2
  - snapshot: unsupported-visible-target

assert:
  - visible_pixels:
      target: qa:unsupported_visible_visual_actor
      snapshot: unsupported-visible-target
      min_count: 1

name: temporal_assertions_demo
scene: res://ui/main_menu.tscn

viewport:
  width: 1280
  height: 720

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_logs: true

steps:
  - wait_frames: 5
  - call_method:
      target: qa:main_menu
      method: qa_temporal_set_mode
      args:
        - steady
  - wait_frames: 2

assert:
  - max_delta_position:
      target: qa:demo_actor
      window_frames: 12
      max: 120
  - follows:
      leader: qa:demo_actor
      follower: qa:demo_follower
      window_frames: 12
      tolerance: 2
  - never:
      target: qa:demo_actor
      window_frames: 12
      token: qa_temporal_state
      forbidden:
        - forbidden
  - no_errors: true

name: audio_export_demo
scene: res://ui/fixtures/live_audio_demo.tscn

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

steps:
  - wait_frames: 1
  - audio_export:
      name: exported_transients
      target: qa:audio_controller
      method: qa_export_audio_track
      args:
        - deterministic_transients
      analyze: true

assert:
  - no_errors: true

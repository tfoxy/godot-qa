name: bundle_godot_args_demo
scene: res://ui/main_menu.tscn

godot_args:
  - --single-window

viewport:
  width: 1920
  height: 1080

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_screenshot: false
  save_logs: true

steps:
  - wait_frames: 5
  - snapshot: before
  - click: qa:start_button
  - wait_frames: 10
  - snapshot: after_start

assert:
  - exists: qa:pause_menu
  - visible: qa:pause_menu
  - focused: qa:resume_button
  - hidden: qa:main_menu_buttons
  - no_errors: true

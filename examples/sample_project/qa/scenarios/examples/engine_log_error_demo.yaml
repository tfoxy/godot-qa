name: engine_log_error_demo
# Makes the GAME emit one real engine error (push_error) during a step, so the
# `godot_log_error` failure this produces can be compared between a cold run and
# a warm run. Warm slices this scenario's window out of the pooled session log,
# so both paths must report the identical failure. Deliberately NOT part of
# sample_regression_gate: it fails on purpose.
scene: res://ui/fixtures/qa_state_schema_demo.tscn
steps:
  - fixture_call:
      driver: schema_driver
      action: push_engine_error
      params:
        message: godot-qa engine log parity probe
assert:
  - state_matches:
      source: provider
      provider: schema_demo
      path: status
      operator: equals
      expected: ready

name: visual_line_indicator_demo
scene: res://ui/fixtures/visual_line_indicator_demo.tscn

viewport:
  width: 1280
  height: 720

determinism:
  fixed_fps: 60
  seed: 123
  locale: en
  test_mode: true

snapshots:
  save_tree: true
  save_ui: true
  save_logs: true
  save_screenshot: true

steps:
  - wait_frames: 2
  - call_method:
      target: qa:visual_line_indicator_demo
      method: qa_show_valid_line
  - wait_frames: 1
  - snapshot: line-visible

assert:
  - visible_pixels:
      target: qa:line_indicator
      snapshot: line-visible
      min_count: 500
  - no_errors: true
